<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원강금속리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/PretendardVariable.woff2">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>

    
</head>
<body>
    <div id="wrap">
        <h3>제목공간</h3>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide">
                            <img src="img/wonkang_hero_pc.png" alt="hero" class="pc">
                            <img src="img/wonkang_hero_mobile.jpg" alt="hero" class="mo">
                        </div>

                        <div class="swiper-slide">
                            <img src="img/wonkang_hero2_pc.jpg" alt="hero" class="pc">
                            <img src="img/wonkang_hero2_mo.png" alt="hero" class="mo">
                        </div>

                        <!-- <div class="swiper-slide">Slide 3</div> -->
                    </div>
                    <!-- 히어로 슬라이더 컨트롤 -->
                    <div class="swiper-controls" aria-label="히어로 슬라이더 컨트롤">
                        <div class="swiper-pagination"></div>
                        <div class="swiper-scrollbar"></div>
                        <div class="swiper-navigation">
                            <div class="swiper-button-prev" aria-label="이전 슬라이드"></div>
                            <div class="swiper-button-next" aria-label="다음 슬라이드"></div>
                        </div>
                    </div>
                </div>
            
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        // 현재 HTML에 있는 2개의 슬라이드와 순서를 동일하게 유지합니다.
        const heroThumbnails = [
            'img/wonkang_hero_pc.png',
            'img/wonkang_hero2_pc.jpg'
        ];

        const swiper = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            loop: true,

            pagination: {
                el: '.hero-sec .swiper-pagination',
                clickable: true,
                renderBullet: function (index, className) {
                    const number = String(index + 1).padStart(2, '0');
                    return `<span class="${className}" aria-label="${index + 1}번째 슬라이드로 이동">
                        <img src="${heroThumbnails[index]}" alt="" loading="lazy">
                        <span class="hero-pagination-index">${number}</span>
                    </span>`;
                }
            },

            navigation: {
                nextEl: '.hero-sec .swiper-button-next',
                prevEl: '.hero-sec .swiper-button-prev'
            },

            scrollbar: {
                el: '.hero-sec .swiper-scrollbar',
                draggable: true,
                snapOnRelease: true,
                hide: false
            }
        });
    </script>
</body>
</html>
