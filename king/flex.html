<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex레이아웃</title>
    <style>
        * { margin: 0; padding: 0; }
        p { background-color: yellow; }
        span { background-color: yellowgreen; }
        div > div { background-color: lightblue; }

        .frameBox {
            background-color: orange;
            width: 90%; 
            height: 300px;          

            display: flex;
            flex-direction: row;    
            justify-content: flex-start;        
            align-items: stretch;
        }
        .item {
            /* flex-grow: 1; */
            flex-shrink: 0;
        }
        div > P {
            /* flex-grow: 1; */
            width: 500px;
            flex-shrink: 1;
        }
        div > p.item {
            flex-basis: 200px;
            /* width: 400px;
            flex-shrink: 0; */
        }
        div > span {
            /* flex-grow: 0,5; */
        }
        div > div {
            /* flex-grow: 2; */
        }
        .frameBox> P {
            width: 150px;
            height: 100px;
        }
        /*
        stretch가 적용되면 늘어나게 됨
        이때 플렉스아이템에 w,h가 적용되면 stretch속성 적용 불가
        플렉스 아이템이 피그마 기준 hug형태 - 콘텐츠 크기
        flex-grow: 0; 플랙스아이템의 비율을 맞추는 속성
        flex-shrink: 1; 플렉스아이템의 공간이 부모컨테이너보다 커지면
        알아서 축소된 비율 값을 1로 설정

        /*  
            flex-direction이 row와 column일때 방향이 달라지고 
            방향이 달라지면서 주축과 교차축이 변경된다.
            그러나 row와 column일때 주축과 교차축에 사용하는 속성은 같다 (속성은 같으나 상황이달라짐)
            예를들어 align-items: stretch속성이 row일땐 위아래를 늘리지만 column일땐 좌우를 늘린다 

            row-reverse, column-reverse
            gap
            row-gap, column-gap

            justify-content 속성 - row일때 좌우정렬, column일때 위아래정렬 
            - flex-start(기본값), center, flex-end, space-around, space-between, space-evenly
            - space-between이 피그마 오토레이아웃에서 gap:auto기능과 같음
            - space-evenly는 패딩과 gap을 같이 넣은 것과 같음
            align-items속성 - row일때 위아래, column일때 좌우
            - stretch(기본값), flex-start, flex-end, center

            만약에 basis에 200px을 줘도 shrink가 기본값이 1이므로
            컨테이너 사이즈보다 아이템사이즈가 커지면
            200px보다 작아질 수 있다.

            플렉스아이템속성
            flex: 0 1 auto; (flex_grow/flex_shrink/flex_basis) = 기본값
            flex: 1; (flex: 1 1 0%)
        */

    </style>
</head>
<body>
    <div class="frameBox">
        <p class="item">플렉스아이템01</p>
        <span class="item">플렉스아이템02</span>
        <div class="item">플렉스아이템03</div>
    </div>
</body>
</html>
