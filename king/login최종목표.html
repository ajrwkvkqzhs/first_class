<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../font/css/bkbulmatpro.css">
        <link rel="stylesheet" href="../font/css/sdgothicneo.css">
        <link rel="stylesheet" href="../font/css/pretendardvariable.css">
        <link rel="stylesheet" href="../CSS/default.css">
        <title>버거킹 로그인 화면</title>
        <style>
            :root {
                --font: "Sandoll GothicNeoRound", sans-serif;
                --font-pre: "Pretendard Variable", sans-serif;
                --font-BKR: "BKR", sans-serif;
                --primary: #512314;
                --disabledBg: #DDCEBE;
                --focus: #D62302;
                --baseBorder: #D9CFC6;
                --baseBg: #FFFCF9;
                --errorColor: #C54734;
                --placeholder: #EBE6E2;
                --text: #766053;
                --bg: #F4EBDC;
                --button: #E9DDCD;
                --inputBg: #FFFCF9;
            }

            html {
                /* 390px 화면을 기준으로 작은 화면에서는 비율에 맞춰 축소 */
                font-size: clamp(7.18px, 2.5641vw, 10px);
            }

            body {
                font-family: var(--font);
                font-size: 1.6rem;
                color: var(--primary);
                background-color: var(--baseBg);
            }

            #wrap {
                width: 100%;
                max-width: 390px;
                min-height: max(100dvh, 84.4rem);
                margin: 0 auto;
                background-color: var(--bg);
            }

            /* 참고 이미지의 휴대폰 상태 표시줄 */
            .status_bar {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: space-between;
                height: 5.2rem;
                padding: 0 3.2rem 0 4.8rem;
                color: #000;
            }

            .status_time {
                font-family: var(--font-pre);
                font-size: 1.8rem;
                font-weight: 600;
                line-height: 1;
            }

            .status_notch {
                position: absolute;
                top: 1.2rem;
                left: 50%;
                width: 12.2rem;
                height: 3.5rem;
                border-radius: 2rem;
                background-color: #000;
                transform: translateX(-50%);
            }

            .status_icons {
                width: 7.6rem;
                height: 1.8rem;
            }

            header {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 5.8rem;
            }

            h1 {
                font-size: 1.7rem;
                font-weight: 700;
                line-height: 1;
            }

            .prev_btn {
                position: absolute;
                left: 0.8rem;
                width: 4.8rem;
                height: 4.8rem;
                background: url("svg/back_icon.svg") no-repeat center / contain;
            }

            main {
                padding: 0 2rem 4rem;
            }

            .title {
                margin-top: 0.8rem;
                margin-bottom: 1.8rem;
                font-family: var(--font-BKR);
                font-weight: 400;
                letter-spacing: -0.02em;
            }

            .title > span {
                display: block;
            }

            .title > span:first-child {
                font-size: 2.4rem;
                line-height: 3.1rem;
            }

            .title > span:last-child {
                font-size: 3.5rem;
                line-height: 4.4rem;
            }

            fieldset {
                min-width: 0;
            }

            .email {
                display: block;
                margin-bottom: 0.5rem;
                font-size: 1.4rem;
                font-weight: 700;
                line-height: 2.4rem;
            }

            .input_box {
                position: relative;
            }

            .input_box + .input_box {
                margin-top: 0.6rem;
            }

            input[type="email"],
            input[type="password"] {
                display: block;
                width: 100%;
                height: 5rem;
                padding: 0 1.6rem;
                border: 1px solid var(--baseBorder);
                border-radius: 0.8rem;
                font-family: var(--font);
                font-size: 1.35rem;
                font-weight: 300;
                color: var(--primary);
                background-color: var(--inputBg);
            }

            input[type="password"] {
                padding-right: 5.4rem;
            }

            input::placeholder {
                color: #B7A7A1;
                opacity: 1;
            }

            input:focus {
                border-color: var(--primary);
            }

            .pw_btn {
                position: absolute;
                top: 50%;
                right: 1.4rem;
                width: 2.8rem;
                height: 2.8rem;
                background: url("svg/eye_icon.svg") no-repeat center / contain;
                transform: translateY(-50%);
            }

            .login_option {
                display: flex;
                align-items: center;
                gap: 2.2rem;
                margin-top: 1.2rem;
                font-size: 1.25rem;
                font-weight: 700;
            }

            .login_option > label {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                white-space: nowrap;
                cursor: pointer;
            }

            /* default.css에서 지운 기본 체크박스 대신 기존 SVG 사용 */
            .login_option input[type="checkbox"] {
                flex: 0 0 2.4rem;
                width: 2.4rem;
                height: 2.4rem;
                border: none;
                background: url("svg/Property 1=Disabled (1).svg") no-repeat center / contain;
                cursor: pointer;
            }

            .login_option input[type="checkbox"]:checked {
                background-image: url("svg/Property 1=Active (1).svg");
            }

            .login_btn {
                display: block;
                width: 100%;
                height: 4.8rem;
                margin-top: 1.4rem;
                border-radius: 2.4rem;
                font-family: inherit;
                font-size: 1.3rem;
                font-weight: 700;
                color: var(--baseBg);
                background-color: var(--disabledBg);
            }

            .login_btn:disabled {
                cursor: default;
            }

            .login_link {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 1.2rem;
                margin-top: 1.2rem;
                font-family: var(--font-pre);
                font-size: 1.1rem;
                font-weight: 500;
                line-height: 2.2rem;
            }

            .login_link > a {
                position: relative;
            }

            .login_link > a + a::before {
                position: absolute;
                top: 50%;
                left: -0.6rem;
                height: 1rem;
                border-left: 1px solid var(--baseBorder);
                content: "";
                transform: translateY(-50%);
            }

            .sns_login {
                margin: 7.2rem 1.8rem 0;
            }

            .sns_login > p {
                display: flex;
                align-items: center;
                gap: 0.8rem;
                font-family: var(--font-pre);
                font-size: 1.05rem;
                font-weight: 500;
                color: var(--text);
                line-height: 2rem;
                white-space: nowrap;
            }

            .sns_login > p::before,
            .sns_login > p::after {
                flex: 1;
                height: 1px;
                background-color: var(--button);
                content: "";
            }

            .sns_list {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 1.6rem;
                margin-top: 1.8rem;
            }

            .sns_list > a {
                display: block;
                flex: 0 0 4.2rem;
                width: 4.2rem;
                height: 4.2rem;
                background-repeat: no-repeat;
                background-position: center;
                background-size: contain;
                border-radius: 50%;
            }

            .sns_list > a:first-child {
                background-image: url("svg/카카오톡 1.svg");
            }

            .sns_list > a:nth-child(2) {
                background-image: url("svg/네이버 1.svg");
            }

            .sns_list > a:nth-child(3) {
                background-image: url("svg/삼성카드 1.svg");
            }

            .sns_list > a:last-child {
                background-image: url("svg/apple_logo_icon.svg");
            }
        </style>
    </head>
    <body>
        <div id="wrap">
            <div class="status_bar" aria-hidden="true">
                <span class="status_time">9:40</span>
                <span class="status_notch"></span>
                <svg class="status_icons" viewBox="0 0 78 18" xmlns="http://www.w3.org/2000/svg">
                    <g fill="currentColor">
                        <rect x="0" y="11" width="3" height="5" rx="1"/>
                        <rect x="5" y="8" width="3" height="8" rx="1"/>
                        <rect x="10" y="5" width="3" height="11" rx="1"/>
                        <rect x="15" y="2" width="3" height="14" rx="1"/>
                        <circle cx="35" cy="14" r="2"/>
                        <rect x="50" y="3" width="25" height="13" rx="4"/>
                        <rect x="76" y="7" width="2" height="5" rx="1"/>
                    </g>
                    <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M27 6 Q35 -1 43 6"/>
                        <path d="M30 10 Q35 5 40 10"/>
                    </g>
                </svg>
            </div>

            <header>
                <h1>로그인</h1>
                <button type="button" class="prev_btn">
                    <span class="sr-only">이전버튼</span>
                </button>
            </header>

            <main>
                <h2 class="title">
                    <span>안녕하세요 :)</span>
                    <span>버거킹입니다.</span>
                </h2>

                <form action="">
                    <!-- 이메일 로그인 -->
                    <fieldset>
                        <legend class="sr-only">로그인화면</legend>

                        <!-- 아이디 -->
                        <label for="email" class="email">이메일 로그인</label>
                        <div class="input_box">
                            <input type="email" id="email" name="email" placeholder="아이디(이메일)을 입력해 주세요.">
                        </div>

                        <!-- 비밀번호 -->
                        <div class="input_box">
                            <input type="password" name="password" aria-label="비밀번호" placeholder="비밀번호를 입력해 주세요.">
                            <button type="button" class="pw_btn">
                                <span class="sr-only">비밀번호 보기</span>
                            </button>
                        </div>

                        <div class="login_option">
                            <label>
                                <input type="checkbox" checked>
                                <span>자동로그인</span>
                            </label>
                            <label>
                                <input type="checkbox">
                                <span>아이디 저장</span>
                            </label>
                        </div>

                        <button type="submit" class="login_btn" disabled>로그인</button>
                    </fieldset>
                </form>

                <div class="login_link">
                    <a href="#">아이디 찾기</a>
                    <a href="#">비밀번호 재설정</a>
                    <a href="#">회원가입</a>
                </div>

                <div class="sns_login">
                    <p>SNS로 간편하게 로그인</p>
                    <div class="sns_list">
                        <a href="#"><span class="sr-only">카카오로그인</span></a>
                        <a href="#"><span class="sr-only">네이버로그인</span></a>
                        <a href="#"><span class="sr-only">삼성카드로그인</span></a>
                        <a href="#"><span class="sr-only">애플로그인</span></a>
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
