<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백그라운드 속성</title>
    <style>
        div {
            width: 500px;
            height: 500px;
        /*    background-color: red;
            background-image: url(bergerking/img/kakao_logo_icon.svg);
            background-position: left top;
            background-repeat: repeat-x;
            background-attachment: fixed;
            background-size: 50px; */
            
            /* 제일 많이 사용하는 형태 */
            background: url(bergerking/img/apple_logo_icon.svg) no-repeat center / 50px;

            /* bg기본값 */
            background: transparent url(bergerking/img/kakao_logo_icon.svg) repeat scroll left top / auto;
        }
        p {
            position: relative;
            top: 500px;
            width: 20px;
            height: 20px;
        }
        section {
            width: 100%;
            height: 400px;
            background-color: yellow;
            /* background-image: linear-gradient(to left, red, yellow); */
            background-image: linear-gradient(45deg, red 0 50%, blue 50% 100%);
            /* 
                linear-gradient, radial-gradient 
                to left, to right, to bottom, to top
                = 0deg, 180deg, 252deg
            */
        }
        article {
            width: 100%;
            height: 300px;
            background: yellow url(images/pic01.jpg) no-repeat center / 100%;
        }
        .cover {
            background-position: 30% 70%;
            background-size: cover;
        }
        .contain {
            background-size: contain;
        }
    </style> 
</head>
<body>
    <div></div>
    <p></p>
    <section></section>
    <br><br><br><br><br><br><br>
    <article></article>
    <br><br><br><br><br><br><br>
    <article class="cover"></article>
    <br><br><br><br><br><br><br>
    <article class="contain"></article>
</body>
</html>
